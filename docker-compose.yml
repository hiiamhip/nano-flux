services:
  postgres:
    image: postgres:16-alpine
    container_name: nanoflux_postgres
    environment:
      POSTGRES_DB: nanoflux
      POSTGRES_USER: nanoflux
      POSTGRES_PASSWORD: nanoflux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanoflux -d nanoflux"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
